# Check that the signing secrets are usable, without signing or notarizing anything. Run by hand.
# Prints pass/fail lines only, never a secret. Specification: docs/signing.md ("Checking the secrets").
name: check-secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    environment: code-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the secrets
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/secrets"
          mkdir -p "$dir"
          trap 'rm -rf "$dir"' EXIT
          echo "$P12_BASE64" | base64 --decode > "$dir/developer-id.p12" 2>/dev/null || true
          printf '%s' "$NOTARY_KEY" > "$dir/notary.p8"
          scripts/check_secrets.sh --p12 "$dir/developer-id.p12" --p12-password-env P12_PASSWORD \
            --identity "$SIGNING_IDENTITY" --team-id "$TEAM_ID" \
            --notary-key "$dir/notary.p8" --notary-key-id "$NOTARY_KEY_ID" --notary-issuer "$NOTARY_ISSUER_ID"
